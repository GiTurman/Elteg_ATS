; GT-ATS — ზარების მარშრუტიზაცია. ავტორი: Giorgi Turmanidze "GT"
;
; შემომავალი: ოპერატორის ხაზი → ჩაწერა → (შეტყობინება) → რიგი 4 ოპერატორზე
;   → პასუხი არ არის → მორიგე ხელმძღვანელი / ტექნიკოსი (აპის „ცვლების“ მიხედვით)
;   → ისევ არა → „ყველა დაკავებულია“ → აპში „უკან დასარეკი“
; ყველა მოვლენა იგზავნება აპის webhook-ზე (pbx-notify).

[globals]
#include extensions_globals.conf

[from-trunk]
exten => _[+0-9a-zA-Z].,1,Goto(inbound,s,1)
exten => s,1,Goto(inbound,s,1)

[inbound]
exten => s,1,NoOp(შემომავალი ზარი: ${CALLERID(num)})
 same => n,Set(__CALLID=${UNIQUEID})
 same => n,Set(__DIR=inbound)
 same => n,Set(CLEAN=${FILTER(0123456789+,${CALLERID(num)})})
 same => n,Set(__FROM=${IF($["${CLEAN}" = ""]?-:${CLEAN})})
 same => n,Set(__TO=${IF($["${MAIN_NUMBER}" = ""]?-:${MAIN_NUMBER})})
 same => n,Set(__AGENT_EXT=-)
 same => n,Set(__CALLER_CHAN=${CHANNEL})
 same => n,Set(CHANNEL(hangup_handler_push)=hh-call,s,1)
 same => n,System(/usr/local/bin/pbx-notify call_started ${CALLID} inbound ${FROM} ${TO} - - &)
 same => n,Answer()
 ; ჩანაწერის სახელს აქვს შემთხვევითი ნაწილი — ბმულის გამოცნობა შეუძლებელია.
 ; recording_ready იგზავნება MixMonitor-ის მიერ, ფაილის დახურვის შემდეგ.
 same => n,Set(__RECF=${CALLID}-${SHA1(${CALLID}${RAND()}${EPOCH})})
 same => n,MixMonitor(${RECF}.wav,b,/usr/local/bin/pbx-notify recording_ready ${CALLID} inbound - - - - ${RECF})
 same => n,ExecIf($[${STAT(e,/var/lib/asterisk/sounds/custom/recording-notice.wav)}]?Playback(/var/lib/asterisk/sounds/custom/recording-notice))
 same => n,Queue(hotline,t,,,${IF($["${QUEUE_TIMEOUT}" = ""]?40:${QUEUE_TIMEOUT})},,,sub-answered)
 same => n,NoOp(რიგი: ${QUEUESTATUS})
 same => n,Set(DIALSTR=${SHELL(/usr/local/bin/pbx-onduty)})
 same => n,GotoIf($["${DIALSTR}" = ""]?noanswer)
 same => n,Dial(${DIALSTR},${IF($["${OVERFLOW_TIMEOUT}" = ""]?30:${OVERFLOW_TIMEOUT})},U(sub-answered))
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n(noanswer),Set(NOANSWER=1)
 same => n,ExecIf($[${STAT(e,/var/lib/asterisk/sounds/custom/all-busy.wav)}]?Playback(/var/lib/asterisk/sounds/custom/all-busy))
 same => n(done),Hangup()

; ოპერატორის ბრაუზერიდან (და გადართვა/REFER — იგივე კონტექსტი).
; გარე ზარი მხოლოდ საქართველოს ნომრებზე: მობილური/ქალაქი/800 (3–8-ით დაწყებული 9-ნიშნა)
; და 112. საერთაშორისო და 9XX (ფასიანი) ნომრები იბლოკება — ანგარიშის მოპარვის დაცვა.
[from-internal]
exten => 112,1,Goto(outbound,112,1)
exten => _[1-9]X,1,Goto(local,${EXTEN},1)
exten => _[1-9]XX,1,Goto(local,${EXTEN},1)
exten => _[1-9]XXX,1,Goto(local,${EXTEN},1)
exten => _[3-8]XXXXXXXX,1,Goto(outbound,${EXTEN},1)
exten => _0[3-8]XXXXXXXX,1,Goto(outbound,${EXTEN},1)
exten => _995[3-8]XXXXXXXX,1,Goto(outbound,${EXTEN},1)
exten => _00995[3-8]XXXXXXXX,1,Goto(outbound,${EXTEN},1)
exten => _+995[3-8]XXXXXXXX,1,Goto(outbound,${EXTEN},1)
exten => _[+0-9*#].,1,NoOp(აკრძალული მიმართულება: ${EXTEN})
 same => n,Hangup(21)

[local]
exten => _X.,1,NoOp(შიდა ზარი ${CALLERID(num)} → ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30,t)
 same => n,Hangup()

[outbound]
exten => _[+0-9].,1,NoOp(გამავალი ზარი → ${EXTEN})
 same => n,Set(NUM=${SHELL(/usr/local/bin/pbx-fmtnum ${FILTER(0123456789+,${EXTEN})})})
 ; არსებული ზარის გადართვა (REFER) გარე ნომერზე — ახალი ჩანაწერი/მოვლენები არ იქმნება
 same => n,GotoIf($["${CALLID}" != ""]?xfer)
 ; ერთდროულად მაქსიმუმ 6 გამავალი ზარი, თითო — მაქსიმუმ 1 საათი
 same => n,Set(GROUP()=out)
 same => n,GotoIf($[${GROUP_COUNT(out)} > 6]?deny)
 same => n,Set(__CALLID=${UNIQUEID})
 same => n,Set(__DIR=outbound)
 same => n,Set(__AGENT_EXT=${CUT(CUT(CHANNEL,/,2),-,1)})
 same => n,Set(__FROM=${IF($["${MAIN_NUMBER}" = ""]?-:${MAIN_NUMBER})})
 same => n,Set(__TO=${NUM})
 same => n,Set(__CALLER_CHAN=${CHANNEL})
 same => n,Set(CHANNEL(hangup_handler_push)=hh-call,s,1)
 same => n,System(/usr/local/bin/pbx-notify call_started ${CALLID} outbound ${FROM} ${TO} ${AGENT_EXT} - &)
 same => n,Set(CALLERID(num)=${MAIN_NUMBER})
 same => n,Set(CALLERID(name)=)
 same => n,Set(__RECF=${CALLID}-${SHA1(${CALLID}${RAND()}${EPOCH})})
 same => n,MixMonitor(${RECF}.wav,b,/usr/local/bin/pbx-notify recording_ready ${CALLID} outbound - - - - ${RECF})
 same => n,Dial(PJSIP/${TO}@trunk,60,U(sub-answered)L(3600000))
 same => n,ExecIf($["${DIALSTATUS}" != "ANSWER"]?Set(NOANSWER=1))
 same => n,Hangup()
 same => n(xfer),Dial(PJSIP/${NUM}@trunk,60,L(3600000))
 same => n,Hangup()
 same => n(deny),NoOp(გამავალი ზარების ლიმიტი)
 same => n,Hangup(34)

; გამოიძახება პასუხის მიმღებ არხზე
[sub-answered]
exten => s,1,Set(PEER=${CUT(CUT(CHANNEL,/,2),-,1)})
 same => n,Set(WHO=${IF($["${DIR}" = "outbound"]?${AGENT_EXT}:${IF($["${PEER}" = "trunk"]?mobile:${PEER})})})
 same => n,Set(SHARED(ANSWERED,${CALLER_CHAN})=1)
 same => n,System(/usr/local/bin/pbx-notify call_answered ${CALLID} ${DIR} ${FROM} ${TO} ${WHO} - &)
 same => n,Return()

; ზარის დასრულება (აბონენტის/ოპერატორის არხზე)
[hh-call]
exten => s,1,Set(ST=${IF($["${SHARED(ANSWERED)}" = "1"]?answered:${IF($["${NOANSWER}" = "1"]?missed:abandoned)})})
 same => n,System(/usr/local/bin/pbx-notify call_ended ${CALLID} ${DIR} ${FROM} ${TO} ${AGENT_EXT} ${ST} &)
 same => n,Return()
