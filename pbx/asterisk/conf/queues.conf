; GT-ATS — ცხელი ხაზის რიგი
[general]
persistentmembers = no
shared_lastcall = yes

[hotline]
strategy = rrmemory
timeout = 20
retry = 1
wrapuptime = 3
ringinuse = no
autofill = yes
joinempty = unavailable,invalid,unknown
leavewhenempty = unavailable,invalid,unknown
announce-frequency = 0
announce-holdtime = no
musicclass = default
